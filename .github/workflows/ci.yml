name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lof
          POSTGRES_PASSWORD: lof_ci
          POSTGRES_DB: lof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lof -d lof_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://lof:lof_ci@127.0.0.1:5432/lof_test
      BCRYPT_ROUNDS: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: two-browser status
        run: npm run test:e2e
